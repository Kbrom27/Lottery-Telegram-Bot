name: CI/CD — Test & Build Windows Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest suite
        env:
          TEST_DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: pytest -v

  build-windows:
    name: Build & Smoke-Test Windows .exe
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Windows build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pystray pyinstaller

      - name: Build LotteryBot.exe
        run: pyinstaller --clean --noconfirm LotteryBot.spec

      - name: Smoke-test LotteryBot.exe
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:TEMP "lottery_smoke_test"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LOTTERY_NO_BROWSER = "1"
          $env:LOTTERY_NO_TRAY = "1"
          $env:LOTTERY_DATA_DIR = $dataDir
          $env:WEB_PORT = "8025"

          $proc = Start-Process -FilePath "dist\LotteryBot\LotteryBot.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8025/healthz" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match "lotterybot") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "LotteryBot.exe did not become healthy in time" }

            $html = Invoke-WebRequest -Uri "http://127.0.0.1:8025/" -UseBasicParsing
            if ($html.StatusCode -ne 200 -or $html.Content -notmatch "LotteryBot") { throw "HTML dashboard failed" }

            $st = (Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/status" -UseBasicParsing).Content | ConvertFrom-Json
            if (-not $st.qr_available) { throw "QR module missing in exe" }

            $dash = Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/dashboard" -UseBasicParsing
            if ($dash.StatusCode -ne 200) { throw "Dashboard failed" }

            $xlsx = Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/export/excel" -UseBasicParsing
            if ($xlsx.StatusCode -ne 200 -or $xlsx.RawContentLength -lt 1000) { throw "Excel export failed" }

            $rep = Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/export/report" -UseBasicParsing
            if ($rep.StatusCode -ne 200 -or $rep.RawContentLength -lt 1000) { throw "Summary report failed" }

            $csv = Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/export/csv" -UseBasicParsing
            if ($csv.StatusCode -ne 200) { throw "CSV export failed" }

            $commit = Invoke-WebRequest -Uri "http://127.0.0.1:8025/api/draw/commit" -Method POST -UseBasicParsing
            if ($commit.StatusCode -ne 200) { throw "Draw commit failed" }

            Write-Host "Smoke test passed! Excel bytes:" $xlsx.RawContentLength
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe")) {
            choco install innosetup --no-progress
          }

      - name: Build Windows Setup Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" scripts\installer.iss
          if (-not (Test-Path "installer_output\LotteryBot-Setup.exe")) {
            Write-Error "Installer executable LotteryBot-Setup.exe was not generated!"
            exit 1
          }

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: LotteryBot-Setup
          path: |
            installer_output/LotteryBot-Setup.exe
            CLIENT_SETUP_GUIDE.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-windows
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download built Windows Setup Installer
        uses: actions/download-artifact@v4
        with:
          name: LotteryBot-Setup
          path: release-files

      - name: Verify release assets
        run: ls -lh release-files/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'LotteryBot Latest Release' }}
          draft: false
          prerelease: false
          files: release-files/*
          generate_release_notes: true
